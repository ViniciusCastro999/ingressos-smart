name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (all modules)
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lintSimulatorDebug lintCieloDebug

      - name: Assemble both flavors
        run: ./gradlew :app:assembleSimulatorDebug :app:assembleCieloDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html

      - name: Upload simulator APK
        uses: actions/upload-artifact@v4
        with:
          name: app-simulator-debug
          path: app/build/outputs/apk/simulator/debug/*.apk
